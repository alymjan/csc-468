name: CI/CD Pipeline

# Trigger this workflow every time code is pushed to the main branch
on:
  push:
    branches:
      - main

jobs:
  # JOB 1: Build the image and push to Docker Hub
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # THE FIX: Set up the modern Docker build engine
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push the Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/voting-app:latest

  # JOB 2: Deploy to CloudLab using the self-hosted runner
  deploy:
    needs: build-and-push # This ensures deploy only runs IF the build succeeds
    runs-on: self-hosted  # This tells GitHub to run these commands on your CloudLab machine
    steps:
      - name: Pull latest image and restart container
        run: |
          cd ~/voting-app
          # Pull the fresh code changes (like the updated docker-compose.yml)
          git pull origin main
          # Pull the newly built image from Docker Hub
          docker-compose pull web
          # Recreate the container with the new image, without touching the database
          docker-compose up -d --no-deps web
